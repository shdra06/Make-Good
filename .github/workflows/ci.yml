name: ci
on:
  push:
    branches: [main, production-grade]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Types (API, web, shared)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm test
      - name: Web build
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
