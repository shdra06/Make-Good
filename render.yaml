# Render Blueprint for Make Good: one web service and one PostgreSQL database.
# On Render: New > Blueprint > pick this repo.
#
# The service runs two processes (scripts/start.mjs): the API privately on
# port 4001 with its job worker, and the Next.js app on Render's PORT, which
# passes /api/* to the API. One public address, first-party cookies.
#
# Runs on the PayPal simulator (no real money) with the synthetic recall case.
# Render asks for GEMINI_API_KEY when the Blueprint is created; leave it empty
# and the notice is read by pattern rules instead.
#
# Free plans: the service sleeps after 15 minutes without visitors (the first
# visit then takes about a minute), and the free database expires after 30 days.

services:
  - type: web
    name: make-good
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Where the web app sends /api/*. Read when the web app is built.
      - key: API_URL
        value: http://127.0.0.1:4001
      - key: API_PORT
        value: "4001"
      # One process runs the API and the payment worker.
      - key: WORKER_INLINE
        value: "true"
      # The built-in PayPal simulator, for the demo. No real money moves.
      - key: ALLOW_SIMULATOR
        value: "true"
      - key: MAKEGOOD_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: make-good-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: make-good-db
    plan: free
    region: oregon
    databaseName: makegood
    user: makegood
